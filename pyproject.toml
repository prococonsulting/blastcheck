[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blastcheck"
version = "0.1.0"
description = "Reference producer of Impact Manifest change-safety assertions from a Terraform plan"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Only needed to run the test suite (which validates output against the schema).
test = ["jsonschema>=4", "pytest>=7"]

[project.scripts]
blastcheck = "blastcheck.__main__:main"

[tool.setuptools]
packages = ["blastcheck"]
