[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blastcheck"
version = "0.7.0"
description = "Reference producer of Impact Manifest change-safety assertions from a Terraform plan"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "Kevin Proffitt" }]
keywords = [
    "terraform",
    "opentofu",
    "infrastructure-as-code",
    "change-management",
    "blast-radius",
    "sre",
    "devops",
    "azure",
    "impact-manifest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://blastcheck.dev"
Specification = "https://github.com/prococonsulting/impact-manifest"
Source = "https://github.com/prococonsulting/blastcheck"
Issues = "https://github.com/prococonsulting/blastcheck/issues"

[project.optional-dependencies]
# Only needed to run the test suite (which validates output against the schema).
test = ["jsonschema>=4", "pytest>=7"]

[project.scripts]
blastcheck = "blastcheck.cli:_entry"

[tool.setuptools]
packages = ["blastcheck", "blastcheck.schema", "blastcheck.packs"]
